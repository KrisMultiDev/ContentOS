[package]
name = "contentos-core"
version.workspace = true
edition.workspace = true

[dependencies]
blake3 = "1"
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
